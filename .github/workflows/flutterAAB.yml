name: Flutter AAB

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: "stable"
  PROPERTIES_PATH: "./android/key.properties"

jobs:
  flutter_test:
    name: Run Flutter assigned build appbundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{env.JAVA_VERSION}}
          
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}

      # Creating the key.properties file
      - run: |
          echo keyPassword=${{ secrets.KEY_STORE }} > ${{ env.PROPERTIES_PATH }}
          echo storePassword=${{ secrets.KEY_PASSWORD }} >> ${{ env.PROPERTIES_PATH }}
          echo keyAlias=${{ secrets.KEY_ALIAS }} >> ${{ env.PROPERTIES_PATH }}
          echo storeFile=key.jks >> ${{ env.PROPERTIES_PATH }}
          
      # Decoding base64 key into a file
      - run: echo "${{ secrets.KEYSTORE2 }}" | base64 --decode > android/app/key.jks

      # Get current version from pubspec.yaml
      - name: Get version from pubspec.yaml
        id: version
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version=$(echo "$version_line" | cut -d' ' -f2 | cut -d'+' -f1)
          echo "Version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          
      # Get dependencies and make assigned appbundle
      - run: | 
          flutter clean
          flutter pub get
          flutter analyze .
          flutter build appbundle
          
      # Make appbundle downloadable
      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: appbundle
          path: |
            build/app/outputs/bundle/release/*.aab

      # Generate changelog from commits since last tag
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                    "title": "## Features",
                    "labels": ["feat", "Feat"]
                },
                {
                    "title": "## Fixes", 
                    "labels": ["fix", "Fix"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|Feat|Fix)(!)?:.*",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "empty_template": ""
            }
          fromTag: ${{ github.event.repository.default_branch }}
          toTag: HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create GitHub Release with tag and changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
