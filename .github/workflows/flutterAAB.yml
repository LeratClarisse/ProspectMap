name: Flutter AAB
on:
  workflow_dispatch:
env:
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: "stable"
  PROPERTIES_PATH: "./android/key.properties"
jobs:
  flutter_test:
    name: Run Flutter assigned build appbundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{env.JAVA_VERSION}}
          
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
      # Creating the key.properties file
      - run: |
          echo keyPassword=${{ secrets.KEY_STORE }} > ${{ env.PROPERTIES_PATH }}
          echo storePassword=${{ secrets.KEY_PASSWORD }} >> ${{ env.PROPERTIES_PATH }}
          echo keyAlias=${{ secrets.KEY_ALIAS }} >> ${{ env.PROPERTIES_PATH }}
          echo storeFile=key.jks >> ${{ env.PROPERTIES_PATH }}
          
      # Decoding base64 key into a file
      - run: echo "${{ secrets.KEYSTORE2 }}" | base64 --decode > android/app/key.jks
      # Get current version from pubspec.yaml
      - name: Get version from pubspec.yaml
        id: version
        run: |
          version_line=$(grep '^version:' pubspec.yaml)
          version=$(echo "$version_line" | cut -d' ' -f2 | cut -d'+' -f1)
          echo "Version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          
      # Get dependencies and make assigned appbundle
      - run: | 
          flutter clean
          flutter pub get
          flutter analyze .
          flutter build appbundle
          
      # Make appbundle downloadable
      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: appbundle
          path: |
            build/app/outputs/bundle/release/*.aab
      # Generate changelog from commits since last tag
      - name: Generate changelog
        id: changelog
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, getting all commits"
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            echo "Getting commits since $LAST_TAG"
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"%s" --no-merges)
          fi
          
          echo "Processing commits:"
          echo "$COMMITS"
          
          # Process commits and categorize them
          FEATURES=""
          FIXES=""
          
          while IFS= read -r commit; do
            echo "Processing: $commit"
            if [[ $commit =~ ^(feat|Feat):[[:space:]]*(.*) ]]; then
              CLEAN_MESSAGE="${BASH_REMATCH[2]}"
              echo "Found feature: $CLEAN_MESSAGE"
              FEATURES="${FEATURES}- ${CLEAN_MESSAGE}"$'\n'
            elif [[ $commit =~ ^(fix|Fix):[[:space:]]*(.*) ]]; then
              CLEAN_MESSAGE="${BASH_REMATCH[2]}"
              echo "Found fix: $CLEAN_MESSAGE"
              FIXES="${FIXES}- ${CLEAN_MESSAGE}"$'\n'
            else
              echo "Ignoring: $commit"
            fi
          done <<< "$COMMITS"
          
          # Build changelog
          CHANGELOG=""
          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}## 🚀 Features"$'\n'"${FEATURES}"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}## 🐛 Bug Fixes"$'\n'"${FIXES}"$'\n'
          fi
          
          # If no feat/fix commits found, provide fallback
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="## 📝 Changes"$'\n'"- Updates and improvements"$'\n'
          fi
          
          echo "Generated changelog:"
          echo "$CHANGELOG"
          
          # Save to GitHub output
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT
      # Create GitHub Release with tag and changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
