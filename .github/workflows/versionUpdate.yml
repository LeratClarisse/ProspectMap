name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # needed to check tags and history

      - name: Bump version in pubspec.yaml (semantic)
        id: bump
        run: |
          # Get latest version from tags or fallback to 0.1.0+0
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          version=$(echo "$last_tag" | sed 's/^v//')
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)

          # Get commits since last tag
          commits=$(git log $last_tag..HEAD --pretty=format:"%s")

          # Determine bump type
          bump="patch"
          echo "$commits" | grep -qE 'BREAKING CHANGE|!:' && bump="major"
          echo "$commits" | grep -qiE '^feat(\(.+\))?: ' && [ "$bump" != "major" ] && bump="minor"

          # Apply bump
          if [ "$bump" = "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$bump" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="${major}.${minor}.${patch}"

          # Extract current build number from pubspec.yaml
          version_line=$(grep '^version:' pubspec.yaml)
          raw_version=$(echo "$version_line" | cut -d' ' -f2)
          current_build=$(echo "$raw_version" | cut -d'+' -f2)
          current_build=${current_build:-0}
          new_build=$((current_build + 1))

          # Update pubspec.yaml
          echo "🔧 Updating to $new_version+$new_build"
          sed -i "s/^version:.*/version: $new_version+$new_build/" pubspec.yaml

          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "build=$new_build" >> $GITHUB_OUTPUT
          echo "tag=v$new_version" >> $GITHUB_OUTPUT

      - name: Commit version bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add pubspec.yaml
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }}+${{ steps.bump.outputs.build }}"
          git push origin HEAD
