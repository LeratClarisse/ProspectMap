image:
  file: .gitpod.dockerfile

github:
  prebuilds:
    enabled: true
    branches: true
    pullRequests: true
    
tasks:
  - name: Setup Flutter Web
    init: |
      export PATH="$HOME/flutter/bin:$PATH"
      flutter doctor
      flutter config --enable-web
      flutter precache
      flutter pub get
    command: |
      export PATH="$HOME/flutter/bin:$PATH"
      flutter run -d web-server --web-port=3000 --release

ports:
  - port: 3000
    onOpen: open-preview

vscode:
  extensions:
    - dart-code.flutter
    - dart-code.dart-code
